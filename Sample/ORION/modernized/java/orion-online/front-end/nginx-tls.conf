# TLS variant — dùng qua docker-compose.tls.yml (mount đè /etc/nginx/conf.d/default.conf).
# Cert do operator cấp: ./certs/server.crt + ./certs/server.key (tự ký hoặc CA).
server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
