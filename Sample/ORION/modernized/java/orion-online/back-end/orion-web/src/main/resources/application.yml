server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

spring:
  application:
    name: orion

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orion}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true

  activemq:
    broker-url: ${MQ_BROKER_URL:vm://localhost?broker.persistent=false}
    in-memory: true

  jms:
    listener:
      auto-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cobol:
  target-db: postgres

logging:
  level:
    root: INFO
    com.appruntime: DEBUG

---
spring:
  config:
    activate:
      on-profile: redis
  autoconfigure:
    exclude: []
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
