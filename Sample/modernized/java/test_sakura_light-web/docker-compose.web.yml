# Docker Compose for WebSocket screen mode — generated by cobol2java
#
# Usage:
#   1. Build the launcher jar:
#        mvn package -pl back-end/launcher -am -DskipTests
#   2. Build the FE:
#        cd front-end && npm install && npm run build && cd ..
#   3. Bring everything up:
#        docker compose -f docker-compose.web.yml up -d
#   4. App listens on http://localhost:8083/  (admin / admin)
#
# Customize the env vars below for your environment (DB credentials, image
# tag, port mapping). The defaults match the development reference setup.

services:

  cobol-poc-db:
    image: postgres:15
    container_name: cobol-poc-db
    environment:
      POSTGRES_DB: cobol_poc
      POSTGRES_USER: cobol
      POSTGRES_PASSWORD: cobol
    ports:
      - "5432:5432"
    volumes:
      - cobol_poc_data:/var/lib/postgresql/data
      # Optional: drop *.sql into docker/postgres-init/ to seed on first start.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - cobol_poc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobol -d cobol_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  cobol-poc-web:
    # amazoncorretto:21 is portable across arm64 (Apple Silicon) and amd64;
    # swap for eclipse-temurin:21-jre on x86_64 hosts if preferred.
    image: amazoncorretto:21
    container_name: cobol-poc-web
    working_dir: /app
    depends_on:
      cobol-poc-db:
        condition: service_healthy
    ports:
      # host:container — change the LHS to relocate from 8083 if needed.
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cobol-poc-db:5432/cobol_poc
      SPRING_DATASOURCE_USERNAME: cobol
      SPRING_DATASOURCE_PASSWORD: cobol
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # JAVA_TOOL_OPTIONS picked up by JVM at startup. Keep -Dscreen.renderer=websocket
      # in web cohort so WebSocketScreenRenderer overrides the DI placeholder.
      JAVA_TOOL_OPTIONS: >-
        -Dcobol.file.sql=true
        -Dscreen.renderer=websocket
        -Dspring.batch.job.enabled=false
        -Dserver.port=8080
        -Dspring.web.resources.static-locations=file:/app/static/
    volumes:
      # Bind-mount the just-built fat-jar — adjust path if the launcher module
      # lives elsewhere in your tree.
      - ./back-end/launcher/target/test-sakura-2808-web-launcher-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
      # Bind-mount the FE Vite build output so Spring serves /assets/* + index.html.
      - ./front-end/dist:/app/static:ro
    networks:
      - cobol_poc_net
    command: ["java", "-jar", "/app/app.jar"]

volumes:
  cobol_poc_data:

networks:
  cobol_poc_net:
    driver: bridge
